name: Bug report
description: Report a problem with a published extension
labels: [bug]
body:
  - type: input
    id: extension
    attributes:
      label: Extension and version
      placeholder: dark-mode 1.0.0
    validations:
      required: true
  - type: input
    id: kondor
    attributes:
      label: Kondor version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
