name: Extension request
description: Ask for a new Kondor extension
labels: [extension-request]
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: A short name for the extension.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What it should do
    validations:
      required: true
  - type: textarea
    id: sites
    attributes:
      label: Sites
      description: The sites it should run on, or "all sites".
    validations:
      required: true
  - type: textarea
    id: similar
    attributes:
      label: Similar extensions in other browsers
      description: Links to extensions that do something similar.
